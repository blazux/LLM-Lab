name: Validate stable path
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      HF_HOME: ${{ runner.temp }}/hf
      HF_DATASETS_CACHE: ${{ runner.temp }}/datasets
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      HF_HUB_OFFLINE: '1'
      LLMLAB_TEST_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared environment
        run: |
          python -m pip install 'torch==2.13.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python scripts/check_environment.py --device cpu
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/smoke_test.py
      - run: python tests/export_fidelity_test.py
      - run: python scripts/qualify_architectures.py --device cpu --output qualification-cpu.json
      - name: Build source candidate
        run: python scripts/build_release.py
      - run: python scripts/check_release.py --archive dist/llm-lab-1.0.0-rc.1.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-qualification-py${{ matrix.python }}
          path: |
            dist/
            qualification-cpu.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

      - name: Validate the frontend from the source archive
        working-directory: .
        run: |
          python scripts/build_release.py
          mkdir -p "$RUNNER_TEMP/llmlab-source"
          tar -xzf dist/llm-lab-1.0.0-rc.1.tar.gz -C "$RUNNER_TEMP/llmlab-source"
          cd "$RUNNER_TEMP/llmlab-source/llm-lab-1.0.0-rc.1/gui/frontend"
          npm ci
          npm test
          npm run build
